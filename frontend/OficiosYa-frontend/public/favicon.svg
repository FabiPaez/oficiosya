<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-opacity="0.25" flood-color="#0f172a" />
    </filter>
  </defs>

  <!-- Fondo redondeado con gradiente azul OficiosYa -->
  <rect width="64" height="64" rx="16" fill="url(#bg)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Herramientas -->
  <g filter="url(#shadow)" transform="translate(32, 33)">
    
    <!-- 1. MARTILLO (Rotado 42deg) -->
    <g transform="rotate(42)">
      <!-- Mango -->
      <rect x="-3.5" y="-10" width="7" height="30" rx="3.5" fill="#ffffff" />
      <rect x="-3.5" y="10" width="7" height="10" rx="2" fill="#cbd5e1" opacity="0.6" />
      <!-- Cabeza del martillo -->
      <path d="M -13 -18 C -7 -18 -4.5 -16 -4 -11 L 4 -11 C 5 -11 6 -11 8 -12 L 8 -19 C 8 -20 9 -21 10.5 -21 L 13.5 -21 C 14.5 -21 15 -20 15 -19 L 15 -7 C 15 -6 14.5 -5 13.5 -5 L 10.5 -5 C 9 -5 8 -6 8 -7 L 8 -11 L 4 -11 C 2 -11 0 -12 -4 -11 C -7 -10 -11 -8 -14 -4 C -15.5 -3 -16.5 -4.5 -15.5 -6.5 C -14.5 -12 -14 -16 -13 -18 Z" fill="#ffffff" />
    </g>

    <!-- 2. LLAVE INGLESA (Rotada -42deg, sobrepuesta con stroke de corte azul) -->
    <g transform="rotate(-42)">
      <!-- Mango -->
      <path d="M -4 -8 L 4 -8 L 4 17 C 4 19.5 2.5 22 0 22 C -2.5 22 -4 19.5 -4 17 Z" 
            fill="#ffffff" stroke="#1d4ed8" stroke-width="3" stroke-linejoin="round" />
      <!-- Ojo inferior de la llave -->
      <circle cx="0" cy="17" r="5" fill="#ffffff" stroke="#1d4ed8" stroke-width="3" />
      <circle cx="0" cy="17" r="2.2" fill="#1d4ed8" />
      
      <!-- Cabeza superior de la llave -->
      <path d="M 0 -22 C 6.5 -22 11 -17.5 11 -11 C 11 -7 8.5 -3.5 5 -2 L 5 -8 L -5 -8 L -5 -2 C -8.5 -3.5 -11 -7 -11 -11 C -11 -17.5 -6.5 -22 0 -22 Z" 
            fill="#ffffff" stroke="#1d4ed8" stroke-width="3" stroke-linejoin="round" />
      <!-- Hueco de mordaza -->
      <path d="M -4 -23 L 4 -23 L 4 -14 L 0 -10.5 L -4 -14 Z" fill="#1d4ed8" />
    </g>

  </g>

  <!-- Chispa / Destello ("Ya") -->
  <g transform="translate(48, 14)">
    <path d="M 0 -7 Q 0 0 7 0 Q 0 0 0 7 Q 0 0 -7 0 Q 0 0 0 -7 Z" fill="url(#gold)" />
    <circle cx="0" cy="0" r="1.8" fill="#ffffff" />
  </g>
</svg>